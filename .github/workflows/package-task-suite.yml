name: Package task suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'task-suite/**'
      - 'evaluation/task-pack-v2/references/A08.json'
      - 'evaluation/task-pack-v2/checklists/A08.json'
      - 'tools/**'
      - '.github/workflows/package-task-suite.yml'
  pull_request:
    paths:
      - 'task-suite/**'
      - 'evaluation/task-pack-v2/references/A08.json'
      - 'evaluation/task-pack-v2/checklists/A08.json'
      - 'tools/**'
      - '.github/workflows/package-task-suite.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test author-side task validation
        run: python -B -m unittest discover -s tools -p "test_*.py"

      - name: Validate task suite and refresh input hashes
        run: python -B tools/release-suite-task-pack.py --refresh-manifest

      - name: Upload task suite
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-task-suite
          path: |
            task-suite/
            !task-suite/**/outputs/**
            !task-suite/**/tmp/**
            !task-suite/.gitignore
            !task-suite/**/__pycache__/**
            !task-suite/**/*.pyc
            !task-suite/**/*.pyo
            !task-suite/**/.pytest_cache/**
            !task-suite/**/.mypy_cache/**
            !task-suite/**/.ruff_cache/**
          if-no-files-found: error
